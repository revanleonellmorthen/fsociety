<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" fill="none">
  <!-- Soft glow backdrop -->
  <circle cx="280" cy="140" r="100" fill="#ffffff" fill-opacity="0.12" />
  <circle cx="140" cy="190" r="70" fill="#ffffff" fill-opacity="0.08" />

  <!-- Calendar Desk Mockup -->
  <g transform="translate(180, 50)">
    <!-- Calendar Body -->
    <rect x="0" y="20" width="160" height="150" rx="16" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.15))"/>
    <!-- Top red/amber bar -->
    <path d="M0 36C0 27.1634 7.16344 20 16 20H144C152.837 20 160 27.1634 160 36V52H0V36Z" fill="#f59e0b" />
    <!-- Rings -->
    <rect x="28" y="10" width="10" height="20" rx="5" fill="#334155" />
    <rect x="75" y="10" width="10" height="20" rx="5" fill="#334155" />
    <rect x="122" y="10" width="10" height="20" rx="5" fill="#334155" />
    <!-- Month text -->
    <text x="80" y="42" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">NOVEMBER 2026</text>
    <!-- Calendar Grid Dots / Cells -->
    <g transform="translate(18, 68)">
      <rect x="0" y="0" width="22" height="18" rx="4" fill="#eff6ff"/>
      <rect x="30" y="0" width="22" height="18" rx="4" fill="#eff6ff"/>
      <rect x="60" y="0" width="22" height="18" rx="4" fill="#0284c7"/>
      <rect x="90" y="0" width="22" height="18" rx="4" fill="#eff6ff"/>
      <text x="71" y="13" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">21</text>
      
      <rect x="0" y="24" width="22" height="18" rx="4" fill="#ecfdf5"/>
      <rect x="30" y="24" width="22" height="18" rx="4" fill="#eff6ff"/>
      <rect x="60" y="24" width="22" height="18" rx="4" fill="#eff6ff"/>
      <rect x="90" y="24" width="22" height="18" rx="4" fill="#fef2f2"/>

      <rect x="0" y="48" width="22" height="18" rx="4" fill="#eff6ff"/>
      <rect x="30" y="48" width="22" height="18" rx="4" fill="#eff6ff"/>
      <rect x="60" y="48" width="22" height="18" rx="4" fill="#fef3c7"/>
      <rect x="90" y="48" width="22" height="18" rx="4" fill="#eff6ff"/>
    </g>
    <!-- Checkmark Badge -->
    <circle cx="145" cy="155" r="20" fill="#10b981" />
    <path d="M138 155L143 160L153 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Student Character (Modern stylized illustration) -->
  <g transform="translate(40, 45)">
    <!-- Body / Jacket (Warm yellow/mustard sweater matching reference) -->
    <path d="M70 145 C50 150 25 185 20 220 L125 220 C120 185 95 150 75 145 Z" fill="#f59e0b" />
    <path d="M60 145 L72 170 L85 145 Z" fill="#ffffff" />
    <path d="M68 158 L72 220 L76 220 L80 158" fill="#d97706" />

    <!-- Neck & Face -->
    <rect x="65" y="120" width="15" height="28" rx="7" fill="#fbcfe8" />
    <ellipse cx="72" cy="100" rx="26" ry="30" fill="#fbcfe8" />

    <!-- Hair (Dark slate/styled) -->
    <path d="M46 95 C46 65 60 60 75 60 C90 60 99 70 99 90 C96 90 92 84 86 85 C80 86 76 92 70 90 C64 88 58 92 50 96 Z" fill="#0f172a" />
    <!-- Friendly smiling face -->
    <circle cx="64" cy="98" r="2.5" fill="#1e293b" />
    <circle cx="80" cy="98" r="2.5" fill="#1e293b" />
    <path d="M68 110 C70 114 74 114 76 110" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Glasses -->
    <rect x="58" y="93" width="13" height="11" rx="3" fill="none" stroke="#0284c7" stroke-width="2"/>
    <rect x="74" y="93" width="13" height="11" rx="3" fill="none" stroke="#0284c7" stroke-width="2"/>
    <line x1="71" y1="98" x2="74" y2="98" stroke="#0284c7" stroke-width="2"/>

    <!-- Student holding tablet/folder -->
    <rect x="18" y="175" width="45" height="35" rx="6" fill="#1e293b" transform="rotate(-15 18 175)"/>
    <rect x="22" y="178" width="37" height="28" rx="4" fill="#38bdf8" transform="rotate(-15 18 175)"/>
    <circle cx="34" cy="192" r="7" fill="#fbcfe8" />
  </g>

  <!-- Decorative floating sparks -->
  <circle cx="45" cy="40" r="3" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="320" cy="30" r="4" fill="#fde68a" />
  <circle cx="355" cy="110" r="2.5" fill="#ffffff" fill-opacity="0.6" />
</svg>
